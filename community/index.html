<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-title" content="tiny bao">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#70D4F1">
  <link rel="apple-touch-icon" href="/lilbao_351.png">
  <link rel="icon" type="image/png" href="/lilbao_351.png">
  <title>tiny bao community</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <canvas id="c" aria-label="A building full of tiny baos going about their day"></canvas>
  <button class="round" id="bSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M12 2.8l1.6 2.3 2.7-.7.6 2.7 2.7.6-.7 2.7 2.3 1.6-2.3 1.6.7 2.7-2.7.6-.6 2.7-2.7-.7L12 21.2l-1.6-2.3-2.7.7-.6-2.7-2.7-.6.7-2.7L2.8 12l2.3-1.6-.7-2.7 2.7-.6.6-2.7 2.7.7z" fill="#FFF3D6"/><circle cx="12" cy="12" r="3.4" fill="#BFE6F5"/></svg><i class="dot" aria-hidden="true"></i></button>
  <div id="settings" hidden>
    <div class="bc st">
      <h2>Settings</h2>
      <div class="st-row"><span>Music</span><button class="spk" id="swMusic" aria-pressed="true" aria-label="Turn music on"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M3.5 9.2h3.8l4.9-4v13.6l-4.9-4H3.5z"/><path class="on" d="M15.6 9.4a3.6 3.6 0 0 1 0 5.2M18.2 6.8a7.3 7.3 0 0 1 0 10.4"/><path class="off" d="M15.8 9.6l4.8 4.8M20.6 9.6l-4.8 4.8"/></svg></button><input type="range" class="vol" id="volMusic" min="0" max="100" step="1" aria-label="Music volume"></div>
      <div class="st-row"><span>Sound effects</span><button class="spk" id="swSound" aria-pressed="false" aria-label="Mute sound effects"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M3.5 9.2h3.8l4.9-4v13.6l-4.9-4H3.5z"/><path class="on" d="M15.6 9.4a3.6 3.6 0 0 1 0 5.2M18.2 6.8a7.3 7.3 0 0 1 0 10.4"/><path class="off" d="M15.8 9.6l4.8 4.8M20.6 9.6l-4.8 4.8"/></svg></button><input type="range" class="vol" id="volSound" min="0" max="100" step="1" aria-label="Sound effects volume"></div>
      <h3>Updates</h3>
      <div class="st-row"><span id="stVersion"></span><button id="stUpdate">check for updates</button></div>
      <h3>Your community</h3>
      <p class="st-note">Every bao, the house, the photos and the diary live in this browser only. Save a copy to keep them safe or to move them to another device.</p>
      <div class="st-btns"><button id="stExport">save a copy</button><button id="stImport">restore from a copy</button></div>
      <div class="cardBtns"><button id="stDone">done</button></div>
    </div>
  </div>
  <button id="plans" aria-label="What the baos are building"></button>
  <div id="plansCard" hidden><div class="bc pc" id="pcBody"></div></div>
  <div id="tag" role="button" tabindex="0" hidden></div>
  <div id="baoCard" hidden>
    <div class="bc">
      <canvas id="bcPic" width="160" height="140" aria-hidden="true"></canvas>
      <h2 id="bcTitle"></h2>
      <p id="bcAbout"></p>
      <label class="bcName">Name <input id="bcName" maxlength="14" autocomplete="off" spellcheck="false"></label>
      <div id="bcSwatches" role="radiogroup" aria-label="Colour"></div>
      <p id="bcErr"></p>
      <div class="cardBtns"><button id="bcCancel">not now</button><button id="bcOk">done</button></div>
    </div>
  </div>
  <div id="photoView" hidden>
    <img id="pvImg" alt="A photo of the community">
    <div class="pvBar"><span id="pvWhen"></span><span class="pvBtns"><button id="pvDel">delete</button><button id="pvClose" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></span></div>
  </div>
  <div id="hint" hidden></div>

  <div id="card" hidden>
    <h2 id="cardTitle"></h2>
    <div id="cardBody"></div>
    <div class="cardBtns"><button id="cardDiary" hidden>read the diary</button><button id="cardOk">ok</button></div>
  </div>

  <div id="bar">
    <button class="round" id="bDiary" title="Diary" aria-label="Open the diary">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5" fill="#FFF3D6"/><path d="M5 3h3v18H5z" fill="#F2A65A"/><path d="M11 8h5M11 12h5M11 16h3"/><rect x="5" y="3" width="14" height="18" rx="2.5" fill="none"/></svg>
    </button>
    <div id="tray">
      <div id="slots"></div>
      <div id="trayNote">today’s things</div>
    </div>
    <div class="right">
      <button class="round" id="bCam" title="Camera" aria-label="Take a photo">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3" fill="#FFF3D6"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/><circle cx="12" cy="13.5" r="3.6" fill="#BFE6F5"/><circle cx="17.6" cy="10" r=".9" fill="#E8604C" stroke="none"/></svg>
      </button>
    </div>
  </div>

  <div id="diary" hidden>
    <div class="book">
      <div class="bookTop"><span class="grab" aria-hidden="true"></span><div class="plate"><button class="jump" id="bookFirst" aria-label="First page" title="First page">«</button><h2 id="diaryTitle">Diary</h2><button class="jump" id="bookLast" aria-label="Latest page" title="Latest page">»</button></div><span id="bookNav"></span></div>
      <div class="pagesWrap"><span class="ribbon" aria-hidden="true"></span><div id="bookPages"></div><span class="edges" aria-hidden="true"></span></div>
      <p class="swipeHint" id="swipeHint" hidden>swipe down to close</p>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  </div>
  <script type="module" src="js/main.js?v=12"></script>
</body>
</html>
